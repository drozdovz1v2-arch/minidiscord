<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>MiniDiscord Loading</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.32;
      background-image:
        radial-gradient(circle at 12% 22%, rgba(255,255,255,0.9) 0 1px, transparent 1.5px),
        radial-gradient(circle at 24% 76%, rgba(255,255,255,0.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 41% 35%, rgba(255,255,255,0.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 54% 62%, rgba(255,255,255,0.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 68% 18%, rgba(255,255,255,0.85) 0 1px, transparent 1.5px),
        radial-gradient(circle at 76% 46%, rgba(255,255,255,0.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 88% 27%, rgba(255,255,255,0.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 91% 74%, rgba(255,255,255,0.8) 0 1px, transparent 1.5px);
    }

    .aurora-line {
      position: fixed;
      right: -8%;
      top: 16%;
      width: 78vw;
      height: 220px;
      border-radius: 999px;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 18% 50%, rgba(130, 104, 255, 0.18), transparent 30%),
        linear-gradient(90deg,
          rgba(78, 157, 255, 0) 0%,
          rgba(86, 180, 255, 0.2) 18%,
          rgba(140, 110, 255, 0.3) 52%,
          rgba(89, 207, 255, 0.16) 76%,
          rgba(255,255,255,0) 100%);
      filter: blur(18px);
      transform: rotate(-10deg);
      opacity: 0.9;
    }

    .splash-shell {
      width: 520px;
      position: relative;
      z-index: 1;
    }

    .splash-card {
      padding: 22px 24px 22px;
      text-align: center;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent),
        rgba(14, 17, 34, 0.78);
    }

    .splash-card.ui-fade-out {
      animation: splash-card-out 520ms ease forwards;
    }

    .splash-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      -webkit-app-region: drag;
      user-select: none;
    }

    .splash-topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .splash-mini-logo {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(145deg, rgba(95,82,255,0.34), rgba(55,145,255,0.18));
      border: 1px solid rgba(255,255,255,0.08);
      flex: 0 0 auto;
    }

    .splash-mini-logo img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      display: block;
    }

    .splash-mini-title {
      font-size: 13px;
      color: var(--text);
      letter-spacing: 0.02em;
      font-weight: 700;
    }

    .splash-topbar-right {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .splash-close-btn {
      width: 34px;
      height: 30px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #d8deff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition:
        background 140ms ease,
        color 140ms ease,
        transform 120ms ease;
    }

    .splash-close-btn:hover {
      background: rgba(218,55,60,0.18);
      color: #ffffff;
    }

    .splash-close-btn:active {
      transform: scale(0.96);
    }

    .hero-area {
      position: relative;
      padding-top: 6px;
    }

    .logo-wrap {
      width: 148px;
      height: 148px;
      margin: 0 auto 14px;
      position: relative;
      display: grid;
      place-items: center;
      animation: floaty 3s ease-in-out infinite;
    }

    .logo-wrap::after {
      content: "";
      position: absolute;
      width: 182px;
      height: 182px;
      background: radial-gradient(circle, rgba(91,100,245,0.34), transparent 70%);
      filter: blur(28px);
      z-index: -1;
      animation: ui-glow-pulse 3s ease-in-out infinite;
    }

    .orbit {
      position: absolute;
      inset: 0;
      border-radius: 42px;
      border: 2px solid rgba(91,100,245,0.18);
      animation: spin 8s linear infinite;
    }

    .orbit::before,
    .orbit::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: var(--brand-2);
      box-shadow: 0 0 16px rgba(73,183,255,0.7);
    }

    .orbit::before {
      width: 11px;
      height: 11px;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
    }

    .orbit::after {
      width: 8px;
      height: 8px;
      bottom: -4px;
      left: 20px;
    }

    .orbit.inner {
      inset: 12px;
      border-radius: 34px;
      border-color: rgba(141,125,255,0.15);
      animation-direction: reverse;
      animation-duration: 6s;
    }

    .logo {
      width: 114px;
      height: 114px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      border-radius: 34px;
      overflow: hidden;
      background:
        linear-gradient(145deg, rgba(95,82,255,0.34), rgba(55,145,255,0.18));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 12px 28px rgba(91, 98, 255, 0.22),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .logo-img {
      width: 92px;
      height: 92px;
      object-fit: contain;
      display: block;
      animation: logoFloat 3s ease-in-out infinite;
      filter: drop-shadow(0 10px 24px rgba(91,100,245,0.25));
    }

    .title {
      margin-bottom: 8px;
    }

    .subtitle {
      min-height: 22px;
      margin-bottom: 18px;
      font-size: 14px;
      color: var(--muted);
    }

    .progress-shell {
      width: 100%;
      height: 13px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,0.04);
      margin-bottom: 16px;
    }

    .progress-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      animation: shimmer 2s linear infinite;
    }

    .progress-bar {
      width: 34%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
      box-shadow: 0 0 18px rgba(91,100,245,0.45);
      animation: travel 1.45s ease-in-out infinite;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
      color: #dde3ff;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7f8dff;
      box-shadow: 0 0 12px rgba(127,141,255,0.75);
      animation: pulseDot 1.4s ease-in-out infinite;
      flex: 0 0 auto;
    }

    .stages {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: left;
      margin-bottom: 18px;
    }

    .stage {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 10px 10px 10px 12px;
      min-height: 58px;
      transition: all 180ms ease;
    }

    .stage.active {
      border-color: rgba(91,100,245,0.28);
      background: rgba(91,100,245,0.08);
      box-shadow: inset 0 0 0 1px rgba(91,100,245,0.08);
    }

    .stage.done {
      border-color: rgba(87,217,140,0.22);
      background: rgba(87,217,140,0.08);
    }

    .stage-title {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #eef1ff;
      letter-spacing: 0.02em;
    }

    .stage-text {
      font-size: 11px;
      color: #aeb4d0;
      line-height: 1.35;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: #8e949c;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .footer-right {
      white-space: nowrap;
    }

    .splash-build {
      color: #a2abd1;
      font-size: 11px;
    }

    @keyframes travel {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(340%); }
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-6px) scale(1.05); }
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.35); opacity: 1; }
    }

    @keyframes splash-card-out {
      from {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }
      to {
        opacity: 0;
        transform: scale(1.035);
        filter: blur(12px);
      }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="aurora-line"></div>
  <div class="ambient">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="noise"></div>

  <div class="splash-shell">
    <div class="ui-top-glow"></div>

    <div class="ui-card splash-card" id="card">
      <div class="splash-topbar">
        <div class="splash-topbar-left">
          <div class="splash-mini-logo">
            <img src="logo.png" alt="logo" />
          </div>
          <div class="splash-mini-title">MiniDiscord</div>
        </div>

        <div class="splash-topbar-right">
          <button class="splash-close-btn" onclick="closeWindow()">
            <span style="font-size:14px; line-height:1;">✕</span>
          </button>
        </div>
      </div>

      <div class="hero-area">
        <div class="logo-wrap">
          <div class="orbit"></div>
          <div class="orbit inner"></div>
          <div class="logo">
            <img src="logo.png" alt="logo" class="logo-img" />
          </div>
        </div>

        <div class="ui-title title">MiniDiscord</div>
        <div class="subtitle" id="subtitle">Запуск приложения...</div>

        <div class="progress-shell">
          <div class="progress-bar"></div>
        </div>

        <div class="status-line">
          <div class="status-dot"></div>
          <div id="statusText">Инициализация...</div>
        </div>

        <div class="stages">
          <div class="stage active" id="stage-ui">
            <div class="stage-title">Интерфейс</div>
            <div class="stage-text">Подготовка окон и ресурсов</div>
          </div>

          <div class="stage" id="stage-server">
            <div class="stage-title">Сервер</div>
            <div class="stage-text">Инициализация локального backend</div>
          </div>

          <div class="stage" id="stage-ready">
            <div class="stage-title">Готовность</div>
            <div class="stage-text">Финальная загрузка приложения</div>
          </div>
        </div>

        <div class="footer">
          <div class="footer-left">
            <div class="ui-pill" id="statusPill">Загрузка...</div>
            <div class="splash-build">polished desktop build</div>
          </div>
          <div class="footer-right" id="versionLabel">v...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ipcRenderer = {
      send: (channel, payload) => window.electronAPI.send(channel, payload),
      on: (channel, callback) => window.electronAPI.on(channel, (...args) => callback({}, ...args))
    };

    function closeWindow() {
      ipcRenderer.send('window-close');
    }

    function setStage(activeId, doneIds = []) {
      ['stage-ui', 'stage-server', 'stage-ready'].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.remove('active', 'done');
        if (doneIds.includes(id)) el.classList.add('done');
      });

      const activeEl = document.getElementById(activeId);
      if (activeEl) activeEl.classList.add('active');
    }

    ipcRenderer.on('app-version', (_event, version) => {
      const el = document.getElementById('versionLabel');
      if (el) el.textContent = 'v' + version;
    });

    ipcRenderer.on('splash-status', (_event, payload) => {
      const subtitle = document.getElementById('subtitle');
      const pill = document.getElementById('statusPill');
      const statusText = document.getElementById('statusText');

      if (typeof payload === 'string') {
        if (subtitle) subtitle.textContent = payload;
        if (pill) pill.textContent = payload;
        if (statusText) statusText.textContent = payload;
        return;
      }

      if (payload && typeof payload === 'object') {
        if (subtitle && payload.text) subtitle.textContent = payload.text;
        if (pill && payload.pill) pill.textContent = payload.pill;
        if (statusText && payload.text) statusText.textContent = payload.text;
        if (payload.activeStage) setStage(payload.activeStage, payload.doneStages || []);
      }
    });

    ipcRenderer.on('fade-out-splash', () => {
      const card = document.getElementById('card');
      if (card) card.classList.add('ui-fade-out');
    });

    setStage('stage-ui', []);
  </script>
</body>
</html>
