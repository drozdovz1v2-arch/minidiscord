<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Смена пароля</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #121935;
      border: 1px solid #25315f;
      border-radius: 16px;
      padding: 24px;
      box-sizing: border-box;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
    }
    input {
      background: #0f1630;
      color: #fff;
      border: 1px solid #2d3b70;
    }
    button {
      background: #5b64f5;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }
    #msg {
      margin-top: 14px;
      color: #b8c2ff;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Новый пароль</h2>
    <input id="password" type="password" placeholder="Введите новый пароль" />
    <button id="resetBtn">Сменить пароль</button>
    <div id="msg"></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    const msg = document.getElementById('msg');
    const resetBtn = document.getElementById('resetBtn');
    const passwordEl = document.getElementById('password');

    resetBtn.addEventListener('click', async () => {
      const password = passwordEl.value;

      if (!token) {
        msg.textContent = 'Токен не найден';
        return;
      }

      try {
        const res = await fetch('/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });

        const data = await res.json();
        msg.textContent = data.error || 'Пароль успешно изменён';
      } catch (err) {
        msg.textContent = 'Ошибка сети';
      }
    });
  </script>
</body>
</html>
